name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/inkwell_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test the API
        run: |
          npm ci --prefix server
          npm test --prefix server
      - name: Install and build the client
        run: |
          npm ci --prefix client
          npm run build --prefix client
