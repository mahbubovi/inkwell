[build]
  command = "npm run build"
  publish = "dist"

# Send API calls to the backend. The browser still talks to one site, so the login cookie stays first-party.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API-NAME.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
